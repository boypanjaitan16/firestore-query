name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package

  # Every supported Firebase and React major, plus the oldest supported
  # TanStack Query, against the unit tests and the Firestore emulator.
  compat:
    name: compat (firebase ${{ matrix.firebase }}, react ${{ matrix.react }}, query ${{ matrix.query }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firebase: [ 10, 11, 12, 13 ]
        react: [ 18, 19 ]
        query: [ latest ]
        include:
          - firebase: 10
            react: 18
            query: 5.101.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The Firestore emulator needs Java 21 with firebase-tools 15.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Install the versions under test
        run: |
          # @firebase/rules-unit-testing majors follow Firebase: 3 → 10, 4 → 11, 5 → 12, 6 → 13.
          rules=$(( ${{ matrix.firebase }} - 7 ))
          pnpm add -D \
            "firebase@^${{ matrix.firebase }}" \
            "@firebase/rules-unit-testing@^${rules}" \
            "react@^${{ matrix.react }}" \
            "react-dom@^${{ matrix.react }}" \
            "@types/react@^${{ matrix.react }}" \
            "@types/react-dom@^${{ matrix.react }}" \
            "@tanstack/react-query@${{ matrix.query }}"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:emulator
